<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nirmal Patel | AI/ML Engineer</title>
    <meta name="description" content="Nirmal Patel — AI/ML Engineer & Backend Developer. Projects, experience and skills in Machine Learning, Deep Learning and API development." />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="lattice-wrapper">
      <div id="lattice-container"></div>
    </div>

    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark theme" title="Toggle theme">
      <i class="fas fa-moon"></i>
    </button>

    <header id="navbar">
      <div class="container">
        <nav>
          <ul class="nav-links" id="nav-links"></ul>
        </nav>
      </div>
    </header>

    <main id="sections-root"></main>

    <div id="project-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="readme-header">
          <i class="fas fa-book"></i>
          <div>
            <div id="modal-title" style="font-weight:600; font-size:1rem;"></div>
            <span class="filename" id="modal-filename">README.md</span>
          </div>
          <button class="close-modal" onclick="closeModal()"><i class="fas fa-times"></i></button>
        </div>
        <div id="modal-body"></div>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
